name: Release

# Push a tag like `v0.1.0` to build all packages and publish a GitHub Release.
# "Run workflow" (manual) builds the same packages as downloadable artifacts only.
#
# The in-app updater (crates/kunotes-core/src/update.rs) looks for these exact
# asset names in the latest release, plus SHA256SUMS:
#   KuNotes-macos-arm64.zip, KuNotes-windows-x64.zip, KuNotes-fedora-x86_64.rpm
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Tag matches Cargo.toml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cargo_version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "${GITHUB_REF_NAME#v}" != "$cargo_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match Cargo.toml version $cargo_version"
            exit 1
          fi

  macos:
    name: macOS (.dmg, .zip)
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: Swatinem/rust-cache@v2
      - run: packaging/macos/bundle.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            target/release/bundle/macos/*.dmg
            target/release/bundle/macos/*.zip

  windows:
    name: Windows (.zip)
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p kunotes
      - name: Zip the app
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/kunotes.exe dist/KuNotes.exe
          Compress-Archive -Path dist/KuNotes.exe -DestinationPath KuNotes-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: KuNotes-windows-x64.zip

  fedora:
    name: Fedora (.rpm)
    needs: version
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - name: Install system dependencies
        run: |
          dnf install -y git gcc gcc-c++ clang cmake pkgconf-pkg-config \
            fontconfig-devel wayland-devel webkit2gtk4.1-devel \
            libxkbcommon-x11-devel libxcb-devel libX11-devel \
            openssl-devel libzstd-devel vulkan-loader-devel
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p kunotes
      - run: cargo install cargo-generate-rpm --locked
      - run: cargo generate-rpm -p crates/kunotes
      # A fixed name, so the updater can find it in any release.
      - run: cp target/generate-rpm/*.rpm KuNotes-fedora-x86_64.rpm
      - uses: actions/upload-artifact@v4
        with:
          name: fedora
          path: KuNotes-fedora-x86_64.rpm

  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows, fedora]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # The updater installs a package only if its checksum matches this file.
      - name: Write SHA256SUMS
        working-directory: dist
        run: sha256sum * > SHA256SUMS && cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
